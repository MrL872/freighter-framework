# Generated from a manifest check of every worker's TOOL_IMAGE.
# These images publish only linux/arm64 builds, so on an amd64 host they
# run under emulation. Every other worker's image has an amd64 build and
# runs natively, so it is not listed here.
#
# Re-check after changing a TOOL_IMAGE line:
#   docker manifest inspect -v <image> | findstr architecture
# Remove a service entry once its image publishes amd64.

services:
  subfinder-worker:
    platform: linux/amd64
  shuffledns-worker:
    platform: linux/amd64
  masscan-worker:
    platform: linux/amd64
  nmap-worker:
    platform: linux/amd64
  metasploit-worker:
    platform: linux/amd64
  dirsearch-worker:
    platform: linux/amd64
  ffuf-worker:
    platform: linux/amd64
  nuclei-worker:
    platform: linux/amd64
  katana-worker:

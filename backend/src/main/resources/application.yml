settings:
  # Telegram bot token and chats (data/telegram), the MCP gateway config
  # (data/mcp-gateway), the chat agent's cloud-model toggle/API key
  # (data/llm) and its local-model toggle/base URL/API key/model id
  # (data/local-llm). All four are written only by the backend.
  telegram-dir: ${SETTINGS_TELEGRAM_DIR:../data/telegram}
  mcp-gateway-config: ${SETTINGS_MCP_GATEWAY_CONFIG:../data/mcp-gateway/config.json}
  llm-dir: ${SETTINGS_LLM_DIR:../data/llm}
  local-llm-dir: ${SETTINGS_LOCAL_LLM_DIR:../data/local-llm}
  # Where TelegramClient sends its request. Locally (no Docker) this is
  # api.telegram.org directly. In docker-compose.yml, backend-network has no
  # route to the internet, so this is overridden to the telegram-worker
  # service, which relays the request on (see its own README.md).
  telegram-api-base: ${SETTINGS_TELEGRAM_API_BASE:https://api.telegram.org}
  # The telegram-worker container's own address, used only by
  # ServicesStatusController's reachability check (GET /health). Kept
  # separate from telegram-api-base above, which points at the real Telegram
  # API outside Docker -- a status poll must never dial out to it.
  telegram-worker-url: ${SETTINGS_TELEGRAM_WORKER_URL:http://telegram-worker:8080}

chat:
  # MCP gateway that runs worker tools for the chat agent (see mcp-gateway/).
  mcp-gateway-url: ${MCP_GATEWAY_URL:http://mcp-gateway:8811}
  # Cloud model. The key is read from the host environment, never sent to the browser.
  anthropic:
    base-url: ${ANTHROPIC_BASE_URL:https://api.anthropic.com}
    api-key: ${ANTHROPIC_API_KEY:}
    model: ${ANTHROPIC_MODEL:claude-sonnet-5}
  # Local or self-hosted model through an OpenAI-compatible server (Ollama, LM Studio).
  openai-compatible:
    base-url: ${LLM_BASE_URL:}
    api-key: ${LLM_API_KEY:}
    model: ${LLM_MODEL:}

elasticsearch:
  # Docker-network address of the elasticsearch service (see
  # docker-compose.yml). The backend is the only service that writes to the
  # index. ElasticsearchIndexer and ElasticsearchQueryService call this URL
  # over plain REST, with no credentials. Security is off because the node
  # is internal only (see elastic-search/elasticsearch.yml).
  url: ${ELASTICSEARCH_URL:http://elasticsearch:9200}
  retry:
    interval-ms: ${ELASTICSEARCH_RETRY_INTERVAL_MS:30000}

server:
  port: ${SERVER_PORT:8080}

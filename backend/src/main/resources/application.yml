spring:
  application:
    name: freighter-framework

  servlet:
    multipart:
      # Spring Boot's own defaults (1MB/10MB) are sized for a form upload, not
      # a wordlist file or a nuclei-templates folder upload (one HTTP request
      # per file -- see folderUpload.js); WordlistsController/
      # NucleiTemplatesController each still enforce their own 300MB-per-file
      # ceiling on top of this and return a clean error instead of this
      # being the only thing standing in the way.
      max-file-size: 300MB
      max-request-size: 300MB

  datasource:
    # "../data/derby" (not "./data/derby") deliberately -- mvn is run from
    # this module's own directory (backend/), so a "./" default would create
    # a second, separate data/ directory inside backend/ instead of landing
    # in the repo root's data/ alongside what Docker Compose uses (see
    # docker-compose.yml's backend service, which bind-mounts the repo
    # root's ./data/derby to /data/derby in-container -- application-docker.yml's
    # own DERBY_DATABASE_DIR default is that in-container path). One
    # physical directory either way, instead of the two independent Derby
    # databases a "./data/derby" default silently produced before.
    url: jdbc:derby:${DERBY_DATABASE_DIR:../data/derby}/applicationdb;create=true
    driver-class-name: org.apache.derby.jdbc.EmbeddedDriver

freighter:
  database:
    migrations-location: classpath:db/migrations

project-storage:
  # Project Folder's actual storage (see ProjectFileService) -- must match
  # project-storage's mount path in docker-compose.yml on the backend
  # (read-write) and every worker (read-only). "../data/project-storage" for
  # the same reason as DERBY_DATABASE_DIR above -- lands in the repo root's
  # data/project-storage, the same physical directory Docker Compose
  # bind-mounts, rather than a separate one inside backend/.
  directory: ${PROJECT_STORAGE_DIRECTORY:../data/project-storage}
  # What Project Folder accepts (see ProjectFileService): file types by extension,
  # and the largest file in bytes (1048576 = 1024 KB). Keep the frontend's
  # ALLOWED_PROJECT_EXTENSIONS and MAX_PROJECT_FILE_BYTES (projectFolder.js) in step.
  allowed-extensions: txt,md,json,jsonl,xml,csv,html,sqlite,sqlite3,db,yaml,yml,js,ini,log,sarif,har,nmap,gnmap
  max-file-bytes: 1048576

wordlists:
  # Shared wordlist folder for the control panel's wordlist browser (see
  # WordlistService) and the [ file ] menu's "Upload Wordlists" folder picker.
  # Not per profile. Read-write on the backend, read-only on every tool
  # worker (see docker-compose.yml) -- only the backend writes here.
  directory: ${WORDLISTS_DIRECTORY:../data/wordlists}

configs:
  # Shared external-config folder for the control panel's config browser
  # (see ConfigsService) and the [ file ] menu's "Upload Configs" folder
  # picker. Not per profile. Read-write on the backend, read-only on every
  # worker whose tool accepts an external config file (see
  # docker-compose.yml) -- only the backend writes here.
  directory: ${CONFIGS_DIRECTORY:../data/configs}

nuclei-templates:
  # Shared template folder nuclei-worker scans with (see NucleiTemplatesService
  # and the [ file ] menu's "Upload Nuclei Templates" folder picker). Not per
  # profile. Read-write on both the backend and nuclei-worker (see
  # docker-compose.yml) -- populating it by dropping files directly into
  # ./data/nuclei-templates on the host still works exactly as before; this
  # is just a second, in-app way to do the same thing.
  directory: ${NUCLEI_TEMPLATES_DIRECTORY:../data/nuclei-templates}

image-storage:
  # Image Storage's actual storage (see ImageFileService) -- same
  # "../data/..." convention as project-storage above, matching
  # docker-compose.yml's image-storage bind mount on the backend service.
  directory: ${IMAGE_STORAGE_DIRECTORY:../data/image-storage}

